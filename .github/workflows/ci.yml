name: CodePool quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codepool-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Run security integration smoke
        env:
          PORT: 3100
          HOSTNAME: 127.0.0.1
          CODEPOOL_DATABASE_PATH: /tmp/codepool-ci.sqlite
          CODEPOOL_JWT_SECRET: ci-only-jwt-secret-with-more-than-32-characters
          CODEPOOL_MASTER_KEY: ci-only-master-key-with-more-than-32-characters
          CODEPOOL_ADMIN_EMAIL: admin@codepool.test
          CODEPOOL_ADMIN_PASSWORD: ci-only-admin-password-32-characters
          WECHAT_MOCK_LOGIN: "true"
          CODEPOOL_SMOKE_BASE_URL: http://127.0.0.1:3100
        run: |
          npm run dev -w @codepool/web -- --hostname 127.0.0.1 --port 3100 > /tmp/codepool-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null && break
            sleep 1
          done
          npm run smoke:security
      - run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: codepool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
