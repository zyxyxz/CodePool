name: CodePool manual checks

# Pushes deploy directly through Dokploy. No competing GitHub build or deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run check:miniapp && npm test
      - run: node --test apps/miniapp/tests/*.test.cjs
